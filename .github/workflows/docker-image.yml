name: Docker Image CI

on:
  push:
    branches: [ "3.2" ]
  pull_request:
    branches: [ "3.2" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag library/influxdb:3.2.0-core-$(date +%s)
